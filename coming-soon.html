<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="robots" content="noindex, follow">
    <title>Neon Vector | Lambda Apps</title>
    <meta name="description" content="Neon Vector - A minimalist arcade game. Download now on Google Play.">
    <meta http-equiv="refresh" content="4;url=https://play.google.com/store/apps/details?id=com.silentsum.game">
    <meta name="theme-color" content="#050505">
    
    <!-- Security Headers -->
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .redirect-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .redirect-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(0, 212, 170, 0.1) 0%, transparent 50%),
                repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);
            z-index: -1;
        }

        .redirect-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        .redirect-icon svg {
            width: 100%;
            height: 100%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .redirect-title {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .redirect-subtitle {
            font-size: 1.125rem;
            color: #888;
            margin-bottom: 2rem;
            font-family: var(--font-mono);
        }

        .redirect-progress {
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .redirect-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d4aa, #00a8e8);
            animation: progress 4s linear forwards;
        }

        @keyframes progress {
            to { width: 100%; }
        }

        .redirect-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background: #fff;
            color: #000;
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 0.875rem;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: none;
        }

        .redirect-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 212, 170, 0.3);
        }

        .redirect-note {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #666;
        }

        .redirect-home {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-family: var(--font-mono);
            font-size: 0.875rem;
            color: #888;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }

        .redirect-home:hover {
            color: #fff;
        }

        .redirect-home svg {
            width: 16px;
            height: 16px;
        }
    </style>
</head>

<body>
    <div id="cursor" class="cursor"></div>
    <div id="cursor-follower" class="cursor-follower"></div>

    <a href="index.html" class="redirect-home" data-hover>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Home
    </a>

    <main class="redirect-page">
        <div class="redirect-icon">
            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="50,10 90,80 10,80" stroke-linejoin="round"/>
                <circle cx="50" cy="55" r="15" opacity="0.5"/>
            </svg>
        </div>
        
        <h1 class="redirect-title">Neon Vector</h1>
        <p class="redirect-subtitle">Redirecting to Google Play Store...</p>
        
        <div class="redirect-progress">
            <div class="redirect-progress-bar"></div>
        </div>
        
        <a href="https://play.google.com/store/apps/details?id=com.silentsum.game" class="redirect-button" data-hover>
            <span>Download Now</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M7 17L17 7M17 7H7M17 7V17"/>
            </svg>
        </a>
        
        <p class="redirect-note">If not redirected automatically, click the button above.</p>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
