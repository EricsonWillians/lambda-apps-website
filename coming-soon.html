<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Vector | Lambda Apps</title>
    <meta name="description" content="Neon Vector - A minimalist arcade game. Download now on Google Play.">
    <meta http-equiv="refresh" content="3;url=https://play.google.com/store/apps/details?id=com.silentsum.game">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="cursor"></div>
    <div id="cursor-follower"></div>

    <header class="grid-layout">
        <div class="logo"><a href="index.html">LAMBDA APPS</a></div>
        <nav>
            <a href="index.html" class="nav-link" data-hover>RETURN</a>
        </nav>
    </header>

    <main>
        <section class="fullscreen-section grid-layout">
            <div class="hero-content redirect-content">
                <div class="redirect-icon">
                    <svg viewBox="0 0 100 100" class="neon-triangle-large">
                        <polygon points="50,10 90,80 10,80" fill="none" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
                <h1 class="glitch" data-text="NEON VECTOR">NEON VECTOR</h1>
                <p class="hero-sub">Redirecting to Google Play Store...</p>
                <a href="https://play.google.com/store/apps/details?id=com.silentsum.game" class="redirect-button" data-hover>
                    DOWNLOAD NOW
                </a>
                <p class="redirect-note">If not redirected automatically, click the button above.</p>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
